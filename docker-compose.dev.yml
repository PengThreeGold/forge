version: '3.8'

services:
  # 后端服务 - 开发环境
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: forge-backend-dev
    restart: unless-stopped
    environment:
      - FLASK_CONFIG=development
      - FLASK_DEBUG=True
      - SECRET_KEY=dev-secret-key
      - JWT_SECRET_KEY=dev-jwt-secret-key
      - HTTPS_ENABLED=false
      - DATABASE_PATH=/app/data/forge.db
    volumes:
      - ./backend:/app
      - backend_dev_data:/app/data
      - backend_dev_storage:/app/storage
    networks:
      - forge-network
    ports:
      - "5000:5000"
    depends_on:
      - db

  # 前端服务 - 开发环境
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: forge-frontend-dev
    restart: unless-stopped
    environment:
      - VUE_APP_API_URL=http://localhost:5000/api
      - VUE_APP_TITLE=Forge Dev
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - forge-network
    ports:
      - "8080:8080"
    depends_on:
      - backend

  # 数据库服务
  db:
    image: postgres:13
    container_name: forge-db-dev
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=forge_dev
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - forge-network
    ports:
      - "5432:5432"

  # Redis 服务（用于缓存和会话）
  redis:
    image: redis:6-alpine
    container_name: forge-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    networks:
      - forge-network
    ports:
      - "6379:6379"

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  backend_dev_data:
    driver: local
  backend_dev_storage:
    driver: local

networks:
  forge-network:
    driver: bridge