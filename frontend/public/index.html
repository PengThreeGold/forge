<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" href="<%= BASE_URL %>favicon.ico" />
    <title>Forge - 软件发布管理平台</title>
    <meta
      name="description"
      content="一站式软件发布管理平台，支持软件版本管理、发布管理、存储管理、下载管理、统计分析等功能"
    />
    <!-- Element Plus 使用 SVG 图标，无需预加载字体文件 -->
    <!-- 防止IE使用兼容模式 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- 针对移动设备的优化 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <!-- 主题色 -->
    <meta name="theme-color" content="#409EFF" />
    <!-- Apple设备专用 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Forge" />
    <!-- Windows tiles -->
    <meta name="msapplication-TileColor" content="#409EFF" />
    <meta name="msapplication-config" content="<%= BASE_URL %>browserconfig.xml" />
  </head>
  <body>
    <noscript>
      <strong
        >很抱歉，Forge 软件发布管理平台需要启用JavaScript才能正常工作。请启用它以继续。</strong
      >
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
